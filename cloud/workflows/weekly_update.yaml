main:
  params: [args]
  steps:
    - init:
        assign:
          - project_id: ${default(map.get(args, "project_id"), "podcast-network-prod")}
          - region: ${default(map.get(args, "region"), "us-central1")}
          - scrape_job: ${default(map.get(args, "scrape_job"), "podcast-network-weekly-scrape")}
          - llm_job: ${default(map.get(args, "llm_job"), "podcast-network-weekly-llm")}
          - processing_job: ${default(map.get(args, "processing_job"), "podcast-network-weekly-processing-er")}
          - metrics_job: ${default(map.get(args, "metrics_job"), "podcast-network-weekly-metrics")}
          - predictions_job: ${default(map.get(args, "predictions_job"), "podcast-network-weekly-predictions")}
          - run_label: ${default(map.get(args, "run_label"), "weekly-update-" + sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID"))}
          - future_link_gcs_model_uri: ${default(map.get(args, "future_link_gcs_model_uri"), "gs://podcast-network-prod-podcast-network-artifacts/future-link-training/online-logistic-20260522/future_link_online_logistic.joblib")}
          - raw_snapshot_storage: ${default(map.get(args, "raw_snapshot_storage"), "gcs")}
          - raw_snapshot_gcs_uri: ${default(map.get(args, "raw_snapshot_gcs_uri"), "gs://podcast-network-prod-podcast-network-artifacts/raw-feed-snapshots")}
          - batch_artifact_gcs_uri: ${default(map.get(args, "batch_artifact_gcs_uri"), "gs://podcast-network-prod-podcast-network-artifacts/openai-batches")}
          - plot_output_dir: ${default(map.get(args, "plot_output_dir"), "/tmp/static-plots")}
          - plot_gcs_output_uri: ${default(map.get(args, "plot_gcs_output_uri"), "gs://podcast-network-prod-podcast-network-artifacts/static-plots/latest")}
    - run_scrape:
        call: run_job
        args:
          project_id: ${project_id}
          region: ${region}
          job_name: ${scrape_job}
          job_args:
            - manage.py
            - run_weekly_update_pipeline
            - --phase
            - scrape
            - --coordinator-label
            - ${run_label}
            - --raw-snapshot-storage
            - ${raw_snapshot_storage}
            - --raw-snapshot-gcs-uri
            - ${raw_snapshot_gcs_uri}
        result: scrape_execution
    - run_llm:
        call: run_job
        args:
          project_id: ${project_id}
          region: ${region}
          job_name: ${llm_job}
          job_args:
            - manage.py
            - run_weekly_update_pipeline
            - --phase
            - llm
            - --coordinator-label
            - ${run_label}
            - --batch-artifact-gcs-uri
            - ${batch_artifact_gcs_uri}
        result: llm_execution
    - run_processing:
        call: run_job
        args:
          project_id: ${project_id}
          region: ${region}
          job_name: ${processing_job}
          job_args:
            - manage.py
            - run_weekly_update_pipeline
            - --phase
            - processing-er
            - --coordinator-label
            - ${run_label}
        result: processing_execution
    - run_metrics:
        call: run_job
        args:
          project_id: ${project_id}
          region: ${region}
          job_name: ${metrics_job}
          job_args:
            - manage.py
            - run_weekly_update_pipeline
            - --phase
            - metrics
            - --coordinator-label
            - ${run_label}
        result: metrics_execution
    - run_predictions:
        call: run_job
        args:
          project_id: ${project_id}
          region: ${region}
          job_name: ${predictions_job}
          job_args:
            - manage.py
            - run_weekly_update_pipeline
            - --phase
            - predictions
            - --coordinator-label
            - ${run_label}
            - --future-link-gcs-model-uri
            - ${future_link_gcs_model_uri}
            - --plot-output-dir
            - ${plot_output_dir}
            - --plot-gcs-output-uri
            - ${plot_gcs_output_uri}
        result: predictions_execution
    - done:
        return:
          run_label: ${run_label}
          scrape: ${scrape_execution}
          llm: ${llm_execution}
          processing_er: ${processing_execution}
          metrics: ${metrics_execution}
          predictions: ${predictions_execution}

run_job:
  params: [project_id, region, job_name, job_args]
  steps:
    - start:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project_id + "/locations/" + region + "/jobs/" + job_name}
          body:
            overrides:
              containerOverrides:
                - args: ${job_args}
          connector_params:
            timeout: 86400
        result: execution
    - return_execution:
        return: ${execution}
