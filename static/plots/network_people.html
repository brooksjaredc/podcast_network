": 2, "label": "2 host/guest links"}, {"id": "person_42df44a9054a8bdde5f93a59-person_8c6043104bb8fc3bf6a23a9e", "source": "person_42df44a9054a8bdde5f93a59", "target": "person_8c6043104bb8fc3bf6a23a9e", "weight": 2, "label": "2 host/guest links"}, {"id": "person_a52b86ec1ada43848976525d-person_e02e7584bb0e482a390d5570", "source": "person_a52b86ec1ada43848976525d", "target": "person_e02e7584bb0e482a390d5570", "weight": 2, "label": "2 host/guest links"}, {"id": "person_4ca3c17d00c4f2e81a6bb39b-person_8c6043104bb8fc3bf6a23a9e", "source": "person_4ca3c17d00c4f2e81a6bb39b", "target": "person_8c6043104bb8fc3bf6a23a9e", "weight": 2, "label": "2 host/guest links"}, {"id": "person_e02e7584bb0e482a390d5570-person_ece86909281cf7e769c116fd", "source": "person_e02e7584bb0e482a390d5570", "target": "person_ece86909281cf7e769c116fd", "weight": 2, "label": "2 host/guest links"}, {"id": "person_8c6043104bb8fc3bf6a23a9e-person_ece86909281cf7e769c116fd", "source": "person_8c6043104bb8fc3bf6a23a9e", "target": "person_ece86909281cf7e769c116fd", "weight": 2, "label": "2 host/guest links"}, {"id": "person_28305982b1d476bbb5fa09a4-person_e02e7584bb0e482a390d5570", "source": "person_28305982b1d476bbb5fa09a4", "target": "person_e02e7584bb0e482a390d5570", "weight": 2, "label": "2 host/guest links"}, {"id": "person_28305982b1d476bbb5fa09a4-person_8c6043104bb8fc3bf6a23a9e", "source": "person_28305982b1d476bbb5fa09a4", "target": "person_8c6043104bb8fc3bf6a23a9e", "weight": 2, "label": "2 host/guest links"}, {"id": "person_be69f291fd978916b71ed16a-person_e02e7584bb0e482a390d5570", "source": "person_be69f291fd978916b71ed16a", "target": "person_e02e7584bb0e482a390d5570", "weight": 2, "label": "2 host/guest links"}, {"id": "person_1925fadaea31d1acc8deec4b-person_e02e7584bb0e482a390d5570", "source": "person_1925fadaea31d1acc8deec4b", "target": "person_e02e7584bb0e482a390d5570", "weight": 2, "label": "2 host/guest links"}, {"id": "person_a8b0d0494bd258b048eec1cb-person_dee75cf18382304016027ad2", "source": "person_a8b0d0494bd258b048eec1cb", "target": "person_dee75cf18382304016027ad2", "weight": 2, "label": "2 host/guest links"}, {"id": "person_2aba4381c7910610a3ce612e-person_a8b0d0494bd258b048eec1cb", "source": "person_2aba4381c7910610a3ce612e", "target": "person_a8b0d0494bd258b048eec1cb", "weight": 2, "label": "2 host/guest links"}, {"id": "person_975163b282d927c446b8c1e2-person_a8b0d0494bd258b048eec1cb", "source": "person_975163b282d927c446b8c1e2", "target": "person_a8b0d0494bd258b048eec1cb", "weight": 2, "label": "2 host/guest links"}, {"id": "person_068e37dfa8253ef878854b3b-person_42df44a9054a8bdde5f93a59", "source": "person_068e37dfa8253ef878854b3b", "target": "person_42df44a9054a8bdde5f93a59", "weight": 2, "label": "2 host/guest links"}, {"id": "person_068e37dfa8253ef878854b3b-person_c2c5c1c61432bf5f87077c43", "source": "person_068e37dfa8253ef878854b3b", "target": "person_c2c5c1c61432bf5f87077c43", "weight": 2, "label": "2 host/guest links"}, {"id": "person_068e37dfa8253ef878854b3b-person_a2fdb1dafb1550d389be29c3", "source": "person_068e37dfa8253ef878854b3b", "target": "person_a2fdb1dafb1550d389be29c3", "weight": 2, "label": "2 host/guest links"}, {"id": "person_4ca3c17d00c4f2e81a6bb39b-person_614df938730ef9c8f79f1854", "source": "person_4ca3c17d00c4f2e81a6bb39b", "target": "person_614df938730ef9c8f79f1854", "weight": 2, "label": "2 host/guest links"}], "maxRank": 240, "maxEdgeWeight": 104, "defaultTopN": 180, "defaultMinEdge": 1};
const topN = document.getElementById("topN");
const topNValue = document.getElementById("topNValue");
const minEdge = document.getElementById("minEdge");
const minEdgeValue = document.getElementById("minEdgeValue");
const search = document.getElementById("search");
const stats = document.getElementById("stats");
const detailTitle = document.getElementById("detailTitle");
const detailBody = document.getElementById("detailBody");

topN.min = Math.min(25, payload.maxRank || 25);
topN.max = payload.maxRank || 25;
topN.step = 5;
topN.value = payload.defaultTopN || topN.max;
minEdge.min = 1;
minEdge.max = Math.max(1, payload.maxEdgeWeight || 1);
minEdge.step = 1;
minEdge.value = Math.min(payload.defaultMinEdge || 1, minEdge.max);

const cy = cytoscape({
  container: document.getElementById("cy"),
  wheelSensitivity: 0.18,
  minZoom: 0.15,
  maxZoom: 10,
  style: [
    { selector: "node", style: {
      "background-color": "data(color)",
      "border-color": "#ffffff",
      "border-width": 1,
      "width": "data(renderSize)",
      "height": "data(renderSize)",
      "label": "data(displayLabel)",
      "font-size": "data(renderFontSize)",
      "color": "#334155",
      "text-outline-color": "#ffffff",
      "text-outline-width": "data(renderTextOutlineWidth)",
      "text-max-width": 86,
      "text-wrap": "wrap",
      "text-valign": "bottom",
      "text-margin-y": "data(renderTextMargin)"
    } },
    { selector: "edge", style: {
      "line-color": "#64748b",
      "opacity": 0.5,
      "width": `mapData(weight, 1, ${Math.max(1, payload.maxEdgeWeight || 1)}, 0.8, 6.5)`,
      "curve-style": "bezier"
    } },
    { selector: ".faded", style: { "opacity": 0.08 } },
    { selector: ".selected", style: {
      "border-color": "#111827",
      "border-width": 3,
      "opacity": 1,
      "z-index": 20
    } },
    { selector: "edge.selected", style: {
      "line-color": "#111827",
      "opacity": 0.85,
      "width": 1,
      "z-index": 18
    } }
  ]
});

function elementsForFilters() {
  const rankLimit = Number(topN.value);
  const edgeLimit = Number(minEdge.value);
  const candidateNodes = payload.nodes.filter((node) => node.rank <= rankLimit);
  const candidateNodeIds = new Set(candidateNodes.map((node) => node.id));
  const edges = payload.edges.filter((edge) =>
    edge.weight >= edgeLimit
    && candidateNodeIds.has(edge.source)
    && candidateNodeIds.has(edge.target)
  );
  const connectedNodeIds = new Set(edges.flatMap((edge) => [edge.source, edge.target]));
  const nodes = candidateNodes.filter((node) => connectedNodeIds.has(node.id) || node.rank <= 18);
  return [
    ...nodes.map((node) => ({
      group: "nodes",
      data: {
        ...node,
        renderSize: node.size,
        renderFontSize: 8,
        renderTextMargin: 4,
        renderTextOutlineWidth: 1.5
      },
      position: { x: node.x, y: node.y }
    })),
    ...edges.map((edge) => ({ group: "edges", data: edge }))
  ];
}

function renderGraph() {
  topNValue.textContent = topN.value;
  minEdgeValue.textContent = minEdge.value;
  cy.elements().remove();
  cy.add(elementsForFilters());
  cy.layout({
    name: "preset",
    animate: false
  }).run();
  window.requestAnimationFrame(() => {
    cy.fit(undefined, 28);
    syncScreenScale();
  });
  stats.textContent = `${cy.nodes().length} nodes / ${cy.edges().length} edges`;
  applySearch();
}

let scaleSyncQueued = false;
function syncScreenScale() {
  scaleSyncQueued = false;
  const zoom = Math.max(cy.zoom(), 0.01);
  cy.nodes().forEach((node) => {
    const baseSize = Number(node.data("size")) || 8;
    node.data({
      renderSize: clamp(baseSize / zoom, 3.5, 24),
      renderFontSize: clamp(8 / zoom, 4.5, 10),
      renderTextMargin: clamp(4 / zoom, 2, 7),
      renderTextOutlineWidth: clamp(1.5 / zoom, 0.75, 2)
    });
  });
}

function queueScaleSync() {
  if (scaleSyncQueued) return;
  scaleSyncQueued = true;
  window.requestAnimationFrame(syncScreenScale);
}

function applySearch() {
  const query = search.value.trim().toLowerCase();
  cy.elements().removeClass("faded selected");
  if (!query) return;
  const matches = cy.nodes().filter((node) => node.data("search").includes(query));
  if (!matches.length) return;
  cy.elements().addClass("faded");
  matches.removeClass("faded").addClass("selected");
  matches.neighborhood().removeClass("faded").addClass("selected");
  cy.animate({
    fit: { eles: matches.union(matches.neighborhood()), padding: 54 },
    duration: 180
  });
}

cy.on("tap", "node", (event) => {
  const node = event.target;
  cy.elements().removeClass("faded selected");
  cy.elements().addClass("faded");
  node.removeClass("faded").addClass("selected");
  node.neighborhood().removeClass("faded").addClass("selected");
  detailTitle.textContent = node.data("label");
  detailBody.textContent = `Rank ${node.data("rank")} / ${node.data("detail")}`;
});

cy.on("tap", "edge", (event) => {
  const edge = event.target;
  cy.elements().removeClass("faded selected");
  cy.elements().addClass("faded");
  edge.removeClass("faded").addClass("selected");
  edge.connectedNodes().removeClass("faded").addClass("selected");
  detailTitle.textContent = edge.connectedNodes()
    .map((node) => node.data("label"))
    .join(" - ");
  detailBody.textContent = edge.data("label");
});

cy.on("tap", (event) => {
  if (event.target !== cy) return;
  cy.elements().removeClass("faded selected");
  detailTitle.textContent = payload.title;
  detailBody.textContent = "";
});

document.getElementById("fit").addEventListener("click", () => cy.fit(undefined, 28));
topN.addEventListener("input", renderGraph);
minEdge.addEventListener("input", renderGraph);
search.addEventListener("input", applySearch);
cy.on("zoom", queueScaleSync);
window.addEventListener("resize", () => {
  cy.resize().fit(undefined, 28);
  queueScaleSync();
});

function clamp(value, minValue, maxValue) {
  return Math.max(minValue, Math.min(value, maxValue));
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (character) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[character]));
}

renderGraph();
</script>
